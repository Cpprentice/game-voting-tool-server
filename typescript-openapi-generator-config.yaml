inputSpec: /local/api_spec/combined_openapi.yaml
generatorName: typescript-fetch
outputDir: /local/typescript


# templateDir: /local/openapi_templates/python-fastapi-db-injection
# files:
#   - file to be added to default generator behavior
# globalProperties: null

additionalProperties:
    allowUnicodeIdentifiers: false
    # boolean, toggles whether unicode identifiers are allowed in names or not, default is false (Default: false)

    disallowAdditionalPropertiesIfNotPresent: true
    # If false, the 'additionalProperties' implementation (set to true by default) is compliant with the OAS and JSON schema specifications. If true (default), keep the old (incorrect) behaviour that 'additionalProperties' is set to false by default. (Default: true)
    #     false - The 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
    #     true - Keep the old (incorrect) behaviour that 'additionalProperties' is set to false by default.

    ensureUniqueParams: true
    # Whether to ensure parameter names are unique in an operation (rename parameters that are not). (Default: true)

    enumNameSuffix: Enum
    # Suffix that will be appended to all enum names.

    enumPropertyNaming: PascalCase
    # Naming convention for enum properties: 'camelCase', 'PascalCase', 'snake_case', 'UPPERCASE', and 'original'

    enumPropertyNamingReplaceSpecialChar: false
    # Set to true to replace '-' and '+' symbols with 'minus' and 'plus' in enum of type string

    enumUnknownDefaultCase: false
    # If the server adds new enum cases, that are unknown by an old spec/client, the client will fail to parse the network response.With this option enabled, each enum will have a new case, 'unknown_default_open_api', so that when the server sends an enum case that is not known by the client/spec, they can safely fallback to this case. (Default: false)
    #     false - No changes to the enum's are made, this is the default option.
    #     true - With this option enabled, each enum will have a new case, 'unknown_default_open_api', so that when the enum case sent by the server is not known by the client/spec, can safely be decoded to this case.

    fileNaming: PascalCase
    # Naming convention for the output files: 'PascalCase', 'camelCase', 'kebab-case'.

    # importFileExtension: .ts
    # File extension to use with relative imports. Set it to '.js' or '.mjs' when using ESM.

    legacyDiscriminatorBehavior: true
    # Set to false for generators with better support for discriminators. (Python, Java, Go, PowerShell, C# have this enabled by default). (Default: true)
    #     true - The mapping in the discriminator includes descendent schemas that allOf inherit from self and the discriminator mapping schemas in the OAS document.
    #     false - The mapping in the discriminator includes any descendent schemas that allOf inherit from self, any oneOf schemas, any anyOf schemas, any x-discriminator-values, and the discriminator mapping schemas in the OAS document AND Codegen validates that oneOf and anyOf schemas contain the required discriminator and throws an error if the discriminator is missing.

    licenseName: MIT
    # The name of the license

    modelPropertyNaming: camelCase
    #Naming convention for the property: 'camelCase', 'PascalCase', 'snake_case' and 'original', which keeps the original name

    npmName: "@cpprentice/gvt-client-api"
    # The name under which you want to publish generated npm package. Required to generate a full package

    # npmRepository: null
    # Use this property to set an url your private npmRepo in the package.json

    # npmVersion: null
    # The version of your npm package. If not provided, using the version from the OpenAPI specification file.

    nullSafeAdditionalProps: false
    # Set to make additional properties types declare that their indexer may return undefined

    paramNaming: camelCase
    # Naming convention for parameters: 'camelCase', 'PascalCase', 'snake_case' and 'original', which keeps the original name

    prefixParameterInterfaces: false
    # Setting this property to true will generate parameter interface declarations prefixed with API class name to avoid name conflicts.

    prependFormOrBodyParameters: false
    # Add form or body parameters to the beginning of the parameter list. (Default: false)

    sagasAndRecords: false
    # Setting this property to true will generate additional files for use with redux-saga and immutablejs.

    snapshot: true
    # When setting this property to true, the version will be suffixed with -SNAPSHOT.yyyyMMddHHmm

    sortModelPropertiesByRequiredFlag: true
    # Sort model properties to place required parameters before optional parameters. (Default: true)

    sortParamsByRequiredFlag: true
    # Sort method arguments to place required parameters before optional parameters. (Default: true)

    stringEnums: false
    # Generate string enums instead of objects for enum values.

    supportsES6: false
    # Generate code that conforms to ES6.

    useSingleRequestParameter: false
    # Setting this property to true will generate functions with a single argument containing all API endpoint parameters instead of one argument per parameter.

    useSquareBracketsInArrayNames: false
    # Setting this property to true will add brackets to array attribute names, e.g. my_values[].

    validationAttributes: false
    # Setting this property to true will generate the validation attributes of model    properties.

    withInterfaces: false
    # Setting this property to true will generate interfaces next to the default class implementations.

    withoutRuntimeChecks: false
    # Setting this property to true will remove any runtime checks on the request and response payloads. Payloads will be casted to their expected types.
